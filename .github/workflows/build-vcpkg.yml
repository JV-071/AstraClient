name: Build with vcpkg

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'

    paths:
      - .github/workflows/build-vcpkg.yml
      - cmake/**
      - src/**
      - CMakeLists.txt
      - vcpkg.json

  pull_request:
    paths:
      - .github/workflows/build-vcpkg.yml
      - cmake/**
      - src/**
      - CMakeLists.txt
      - vcpkg.json

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022

    env:
      # Cache binario das deps via GitHub Actions cache (x-gha): salva cada pacote
      # na hora, inclusive quando a run FALHA -> iteracoes rapidas durante o grinding.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Get latest CMake
        uses: lukka/get-cmake@v4.3.2

      - name: Export GitHub Actions cache env (vcpkg x-gha)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # cmd + vcvars64: garante o ambiente MSVC completo nos subprocessos que o
      # vcpkg dispara pra buildar as portas (glew falhava com 'CMAKE_C_COMPILER not
      # set' quando o ambiente era so exportado via msvc-dev-cmd + cmake cru).
      - name: Setup MSVC, build vcpkg deps and AstraClient
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist vcpkg git clone https://github.com/microsoft/vcpkg vcpkg
          call vcpkg\bootstrap-vcpkg.bat
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ github.sha }}
          path: ${{ github.workspace }}/vcpkg/buildtrees/**/*.log
        if: ${{ failure() }}

      - name: Upload artifact binary
        uses: actions/upload-artifact@v4
        with:
          name: astraclient-windows-${{ github.sha }}
          path: |
            ${{ github.workspace }}/build/AstraClient.exe
            ${{ github.workspace }}/build/*.dll
